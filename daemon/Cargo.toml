[package]
name = "guardian"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Omarchy Child Protect Guardian daemon (Stage 1): hold install requests and resolve them via a local decision."
repository = "https://github.com/wasyleque/omarchy-child-protect-guardian"

[lib]
name = "guardian"
path = "src/lib.rs"

[[bin]]
name = "guardiand"
path = "src/bin/guardiand.rs"

[[bin]]
name = "guardian-ctl"
path = "src/bin/guardian-ctl.rs"

[[bin]]
name = "guardian-hook"
path = "src/bin/guardian-hook.rs"

# Dev/pairing helper that simulates the parent app: generates an Ed25519 keypair and signs
# decisions. The real parent app (PWA/native) replaces this; the private key never leaves the phone.
[[bin]]
name = "guardian-sign"
path = "src/bin/guardian-sign.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
base64 = "0.22"
