# Example policy for guardiand. Install to /etc/guardian/policy.toml.
# Any missing key falls back to the built-in default shown here.

# Control socket (list/resolve; owner/root only, peer-credential checked).
socket_path = "/run/guardian/guardian.sock"

# Submit socket (install requests from the pacman hook / flatpak wrapper; any uid may submit).
submit_socket_path = "/run/guardian/submit.sock"

# Max install requests a single uid may have pending at once (anti-flood). Default 5.
max_pending_per_uid = 5

# How long a held install request waits for a parent's decision (seconds)
# before the fallback below is applied.
decision_timeout_secs = 300

# Fallback decision when a request times out. "deny" = fail-closed (recommended).
default_on_timeout = "deny"

# Optional: remote push-approval from the parent's phone via ntfy.
# Omit this whole section (or set enabled = false) for local-only decisions
# (guardian-ctl). When enabled, each held request is pushed to the phone with
# Allow/Deny buttons; the parent's phone subscribes to request_topic.
# IMPORTANT: request_topic must be LONG and UNGUESSABLE (treat it like a secret).
#[ntfy]
#enabled = true
#server = "https://ntfy.sh"      # or your self-hosted ntfy instance
#request_topic = "guardian-REPLACE-WITH-LONG-RANDOM-STRING"
# Zero-trust: pair the parent app's Ed25519 public key here. When set, the daemon runs in
# SIGNED mode and accepts ONLY cryptographically-signed decisions (the raw token path is
# disabled), so a public-broker eavesdropper can't forge an approval. Generate a demo keypair:
#   cargo run --bin guardian-sign -- keygen
#parent_pubkey = "base64-ed25519-public-key"
