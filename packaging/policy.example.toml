# Example policy for guardiand. Install to /etc/guardian/policy.toml.
# Any missing key falls back to the built-in default shown here.

# Control socket (list/resolve; owner/root only, peer-credential checked).
socket_path = "/run/guardian/guardian.sock"

# Submit socket (install requests from the pacman hook / flatpak wrapper; any uid may submit).
submit_socket_path = "/run/guardian/submit.sock"

# Max install requests a single uid may have pending at once (anti-flood). Default 5.
max_pending_per_uid = 5

# Append-only, hash-chained audit log (every request/decision + blocked attempts). Verify with
# `guardian-ctl audit-verify <path>`. On the host, `chattr +i` it / ship it off-box for durability.
audit_path = "/var/log/guardian/audit.log"

# The daemon's own Ed25519 signing key (base64 seed), created on first run (0600). It signs every
# challenge it pushes, so the parent app rejects fake/injected approval cards. Its public key is
# written next to it as daemon.pub and carried into the pairing QR. MUST be under the unit's writable
# StateDirectory (/var/lib/guardian) — /etc is read-only under ProtectSystem=strict, which crashed
# the daemon on a fresh install (review B1).
daemon_key_path = "/var/lib/guardian/daemon.key"

# How long a held install request waits for a parent's decision (seconds)
# before the fallback below is applied.
decision_timeout_secs = 300

# Fallback decision when a request times out. "deny" = fail-closed (recommended).
default_on_timeout = "deny"

# Optional: remote push-approval from the parent's phone via ntfy.
# Omit this whole section (or set enabled = false) for local-only decisions
# (guardian-ctl). When enabled, each held request is pushed to the phone with
# Allow/Deny buttons; the parent's phone subscribes to request_topic.
# IMPORTANT: request_topic must be LONG and UNGUESSABLE (treat it like a secret).
#[ntfy]
#enabled = true
#server = "https://ntfy.sh"      # or your self-hosted ntfy instance
#request_topic = "guardian-REPLACE-WITH-LONG-RANDOM-STRING"
# Zero-trust: pair the parent app's Ed25519 public key here. When set, the daemon runs in
# SIGNED mode and accepts ONLY cryptographically-signed decisions (the raw token path is
# disabled), so a public-broker eavesdropper can't forge an approval. Generate a demo keypair:
#   cargo run --bin guardian-sign -- keygen
#parent_pubkey = "base64-ed25519-public-key"
# Optional off-box audit durability: mirror every signed audit entry + a heartbeat to this separate
# (secret, random) topic the moment it's written, so a later local root rewrite can't hide history.
#audit_topic = "guardian-audit-REPLACE-WITH-LONG-RANDOM-STRING"
#publish_activity = true                            # push a signed "current app" ping so the app shows what the child is doing now

# Optional screen-time schedule (enforcement wiring — Wayland lock/freeze — is a later slice; the
# engine + its logic are implemented and unit-tested now). Minutes are from local midnight.
#[schedule]
#enabled = true
# Defaults applied to every day (minutes from local midnight):
#daily_budget_minutes = 120        # 2 h/day; omit for unlimited (a window/curfew may still apply)
#window_start_min = 420            # 07:00
#window_end_min = 1230             # 20:30
# Nightly curfew ("cisza nocna") — blocks regardless of budget; wraps past midnight when end < start:
#quiet_start_min = 1260            # 21:00
#quiet_end_min   = 420             # 07:00  (so 21:00 → 07:00 is always blocked)
# Per-weekday overrides (keys mon/tue/wed/thu/fri/sat/sun); any field omitted falls back to the
# defaults above. Example: more time at the weekend, later window on Friday:
#[schedule.days.sat]
#budget_minutes = 240
#[schedule.days.sun]
#budget_minutes = 240
#[schedule.days.fri]
#window_end_min = 1320             # 22:00
# Per-child overrides (keys = child usernames; the daemon tracks each child in GUARDIAN_CHILD
# separately). Any field omitted inherits the defaults above. Example: Zosia gets less time + a curfew:
#[schedule.children.zosia]
#daily_budget_minutes = 90
#quiet_start_min = 1200            # 20:00
#quiet_end_min   = 420             # 07:00
#[schedule.children.zosia.days.sat]
#budget_minutes = 150
# Host-side lock/unlock hooks run on block/unblock transitions (see packaging/schedule/README.md):
#lock_command   = "GUARDIAN_CHILD=kid /usr/lib/guardian/guardian-lock"
#unlock_command = "GUARDIAN_CHILD=kid /usr/lib/guardian/guardian-unlock"
#tick_secs = 30                    # lower only for testing

# Optional AI risk-summary: the daemon asks a model for a short "what is this package + risk" note and
# includes it (cryptographically SIGNED, so the broker can't tamper with the verdict) in the request
# the parent sees. Privacy-first: point it at a LOCAL model on your LAN so package names never leave
# your network. Any failure/timeout simply omits the summary — it never blocks or delays a decision.
#[ai]
#enabled = true
#provider = "ollama"                               # "ollama" or "openai" (OpenAI-compatible)
#endpoint = "http://127.0.0.1:11434/api/generate"  # the child box's OWN Ollama (most private); or a LAN box
#model = "llama3.2:latest"                         # 3B, fast, fits an 8 GB GPU; avoid code-only/uncensored models
#timeout_secs = 12
# Daily parenting digest: once a day the daemon summarizes the day (time used, blocked install
# attempts) and — if a DNS query log is given — flags worrying lookups (drugs, self-harm, weapons,
# etc.) with a clear warning, then pushes it to the phone as a signed alert.
#digest_enabled = true
#digest_hour = 20                                   # local hour (0–23) to send it
#digest_lang = "Polish"                             # language of the digest (e.g. Bielik for Polish)
#dns_query_log = "/var/log/guardian/dns-queries.log"  # optional; enables worrying-topic flagging
#activity_log = "/home/CHILD/.local/share/guardian/activity.log"  # optional; adds "apps used today"
# For an OpenAI-compatible endpoint instead:
#provider = "openai"
#endpoint = "https://api.openai.com/v1/chat/completions"
#model = "gpt-4o-mini"
#api_key = "sk-..."

# ---- Local AI autonomy (BETA) - see docs/AI-MODELS.md ---------------------------------------------
# Lets small local ONNX models (service guardian-ai, no network) answer install requests for you and
# adds a guaranteed evening digest listing every decision. Default mode "ask" = nothing changes.
# Switch at runtime (persisted):  guardian-ctl autonomy ask|quiet|auto
#[autonomy]
#mode = "ask"          # ask = every request to you | quiet = model approves GREEN only | auto = model decides
#yellow = "deny"       # auto only: what to do with an uncertain (yellow) rating: "deny" or "ask"
#child_age = 10        # used for the traffic light
#digest_hour = 19      # evening digest, sent EVERY day in quiet/auto (even when nothing happened)
#timeout_secs = 20     # waiting for the sidecar; on timeout/error the request goes to you
#sidecar_socket = "/run/guardian-ai/ai.sock"
# Names that ALWAYS go to you whatever the model says (defaults: messengers, VPN/Tor, hacking tools).
# Setting always_ask REPLACES the default list, so copy the defaults you want to keep.
#always_ask = ["discord", "telegram", "signal", "tor", "vpn"]
