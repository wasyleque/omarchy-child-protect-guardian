# Guardian SafeSearch enforcement via DNS (dnsmasq address= overrides). Install to
# /etc/guardian/dns/safesearch.conf (included by dnsmasq-guardian.conf). Pair with the browser
# policies in ../network/ (ForceGoogleSafeSearch / ForceYouTubeSafetyMode) to avoid TLS warnings.
#
# Only specific SEARCH hostnames are mapped — never a whole domain like google.com, which would
# break mail/drive/accounts. Add localized www.google.<cctld> lines for your locale if needed.

# --- Google SafeSearch (forcesafesearch.google.com) ---
address=/www.google.com/216.239.38.120
address=/www.google.com/2001:4860:4806::78

# --- YouTube Restricted Mode (moderate = restrictmoderate.youtube.com, 216.239.38.120;
#     for STRICT use restrict.youtube.com = 216.239.38.119 / 2001:4860:4806::77) ---
address=/www.youtube.com/216.239.38.120
address=/www.youtube.com/2001:4860:4806::78
address=/m.youtube.com/216.239.38.120
address=/m.youtube.com/2001:4860:4806::78
address=/youtubei.googleapis.com/216.239.38.120
address=/youtube.googleapis.com/216.239.38.120
address=/www.youtube-nocookie.com/216.239.38.120

# --- Bing (strict.bing.com) ---
address=/www.bing.com/204.79.197.220
address=/www.bing.com/2620:1ec:c11::200
address=/bing.com/204.79.197.220

# --- DuckDuckGo (safe.duckduckgo.com) ---
address=/duckduckgo.com/52.142.124.215
