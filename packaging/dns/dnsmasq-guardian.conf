# Guardian filtering resolver — dnsmasq on 127.0.0.1:5354 for the CHILD only (Threat model §4 L3).
# Install to /etc/dnsmasq-guardian.conf and run a dedicated instance:
#   dnsmasq --conf-file=/etc/dnsmasq-guardian.conf
# (or a systemd unit: ExecStart=/usr/bin/dnsmasq -k --conf-file=/etc/dnsmasq-guardian.conf)
# The child's :53 is redirected here by 10-guardian-dns-redirect.nft; root/parent keep the normal resolver.

port=5354
listen-address=127.0.0.1
listen-address=::1
bind-interfaces

# Don't read /etc/resolv.conf; forward to a filtering upstream (Cloudflare for Families: malware+adult).
no-resolv
server=1.1.1.3
server=1.0.0.3

# Category blocklist (sinkholed to 0.0.0.0 by the hosts file the updater maintains).
addn-hosts=/etc/guardian/dns/blocked.hosts

# SafeSearch address overrides.
conf-file=/etc/guardian/dns/safesearch.conf

# Log queries + replies so Guardian can flag blocked/worrying lookups to the parent (real-time alert +
# the daily digest). Stays on THIS machine; rotated daily by /etc/logrotate.d/guardian-dns. The daemon's
# [ai].dns_query_log must point here (/var/log/guardian/dns-queries.log) to use it.
log-queries
log-facility=/var/log/guardian/dns-queries.log

# Hygiene.
domain-needed
bogus-priv
cache-size=1000
